[project]
name = "opencloser"
version = "0.1.0"
description = "openCloser — CRM-first AI communication platform for healthcare-oriented outreach. Slice 2 foundation (Dynamics 365 / Dataverse adapter + state); the user-facing Slice 2 CLI lands in subsequent sub-PRs."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [
    { name = "Medx / openCloser team" },
]
dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.7,<3.0",
    "httpx>=0.27,<1.0",
    # ---- Slice 3 — Real Call, Real CRM ----
    # Used only in real-call / write-enabled mode; rehearsal-mode runs do not
    # require an active SignalWire / Pipecat / real-time-AI provider connection.
    "signalwire>=2.0,<3.0",
    "pipecat-ai>=0.0.40",
    # Embedded ASGI callback receiver — bound only when --real-call is supplied
    # (per specs/003-real-call-real-crm/research.md §1).
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
opencloser = "opencloser.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencloser"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "config/", "pyproject.toml", "README.md"]

# ---- ruff ----

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # allow `assert False` in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---- pytest ----

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=src/opencloser",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
asyncio_mode = "strict"
markers = [
    "module(name): mark a unit-test file as exercising one FR-033 module in isolation (eligibility / transport / persona / crm / core)",
    "integration: end-to-end integration test against the full module stack",
]

[tool.coverage.run]
source = ["src/opencloser"]
omit = [
    "**/__init__.py",
    # Slice 3 SignalWire transport stubs (T013 TDD red). Each method body is
    # `raise NotImplementedError`; meaningful coverage lands in T022-T026
    # when the real implementations replace these stubs. The contract test
    # suite (T013) imports and exercises the public surface; only the
    # NotImplementedError method bodies are excluded here.
    # T022 (2026-05-25): signature.py removed — HMAC-SHA256 verify is real.
    "src/opencloser/transport/signalwire/adapter.py",
    "src/opencloser/transport/signalwire/callbacks.py",
    "src/opencloser/transport/signalwire/dial.py",
    # Slice 3 Pipecat runtime + rejected-auth log + artifact stubs (T013b /
    # T014 TDD red). Same rationale — implementation bodies land in T030 /
    # T032 / T064 / T065 / T066 / T067.
    "src/opencloser/runtime/pipecat/runtime.py",
    "src/opencloser/artifacts/rejected_auth_log.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "pytest-asyncio>=0.23,<1.0",
]
